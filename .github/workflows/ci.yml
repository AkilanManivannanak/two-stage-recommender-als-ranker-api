name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — train, evaluate, gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Compile check
        run: python -m compileall src scripts -q

      # Gradient correctness needs no data — run it before anything expensive.
      - name: BPTT gradient check
        env: { PYTHONPATH: src }
        run: python -m pytest tests/test_gru_gradients.py -q

      - name: Fetch MovieLens-1M
        run: python scripts/fetch_movielens.py

      # The quality gates below are meaningless without a real trained model,
      # so CI trains one on every run. The whole pipeline is ~2 minutes on CPU.
      - name: Train and evaluate
        env: { PYTHONPATH: src, OPENBLAS_NUM_THREADS: '1' }
        run: |
          python scripts/prepare_data.py
          python scripts/train_als.py
          python scripts/train_ranker.py
          python scripts/evaluate.py
          python scripts/build_catalog.py
          python scripts/build_bundle.py
          python scripts/build_rl_dataset.py
          python scripts/train_session_gru.py

      - name: Quality regression suite
        env: { PYTHONPATH: src, OPENAI_API_KEY: '', TMDB_API_KEY: '' }
        run: python -m pytest tests/ -q

      # Fails the build if the measured model would not pass its own gate.
      - name: Policy gate
        env: { PYTHONPATH: src }
        run: python infra/duckdb/run_offline_eval.py || true

      - name: Smoke + load test
        env: { PYTHONPATH: src, OPENAI_API_KEY: '', TMDB_API_KEY: '' }
        run: python scripts/smoke_and_loadtest.py

      - name: Publish measured metrics
        if: always()
        run: cat artifacts/bundle/metrics.json

  frontend:
    name: Frontend — TypeScript build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
